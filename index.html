<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Balloon Pop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎈</text></svg>">
</head>
<body>
    <!-- Camera feed (background) -->
    <video id="camera" autoplay playsinline></video>
    <canvas id="gameCanvas"></canvas>

    <!-- Menu Screen -->
    <div id="menuScreen" class="screen active">
        <div class="menu-container">
            <h1 class="game-title">AR Balloon Pop</h1>
            <p class="subtitle">Pop balloons by clapping your hands!</p>
            <div class="name-input-group">
                <label for="nameInput">Your Name</label>
                <input type="text" id="nameInput" maxlength="16" placeholder="Enter your name">
            </div>
            <button id="hostBtn" class="btn btn-primary">Host Game</button>
            <div class="divider"><span>or</span></div>
            <button id="joinBtn" class="btn btn-secondary">Join Game</button>
            <div id="joinForm" class="join-form hidden">
                <input type="text" id="codeInput" maxlength="5" placeholder="5-digit code" inputmode="numeric">
                <button id="connectBtn" class="btn btn-primary">Connect</button>
            </div>
        </div>
    </div>

    <!-- Lobby Screen -->
    <div id="lobbyScreen" class="screen">
        <div class="lobby-container">
            <h2>Game Lobby</h2>
            <div class="room-code-section">
                <p class="room-code-label">Room Code</p>
                <div id="roomCode" class="room-code"></div>
                <p class="share-text">Share this code with friends!</p>
            </div>
            <div class="players-section">
                <h3>Players</h3>
                <div id="playerList" class="player-list"></div>
            </div>
            <button id="startBtn" class="btn btn-primary hidden">Start Game</button>
            <p id="waitingText" class="waiting-text">Waiting for host to start...</p>
        </div>
    </div>

    <!-- Game HUD -->
    <div id="gameHUD" class="screen">
        <div class="hud-top">
            <div id="timer" class="timer">60</div>
            <div id="scores" class="scores"></div>
        </div>
        <div id="handStatus" class="hand-status">Show your hands!</div>
    </div>

    <!-- Countdown Overlay -->
    <div id="countdownOverlay" class="countdown-overlay hidden">
        <div id="countdownNumber" class="countdown-number">3</div>
    </div>

    <!-- Results Screen -->
    <div id="resultsScreen" class="screen">
        <div class="results-container">
            <h2>Game Over!</h2>
            <div id="winner" class="winner"></div>
            <div id="finalScores" class="final-scores"></div>
            <button id="playAgainBtn" class="btn btn-primary">Play Again</button>
        </div>
    </div>

    <!-- Loading overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <p id="loadingText">Initializing...</p>
    </div>

    <!-- Scripts: CDN dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <!-- Game scripts -->
    <script src="js/hand-tracker.js"></script>
    <script src="js/network.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
